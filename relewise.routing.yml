relewise.trackContentView:
  path: '/relewise/content_view/{entity_type_id}/{entity_id}'
  defaults:
    _controller: '\Drupal\relewise\Controller\RelewiseController::trackContentView'
  requirements:
    _permission: 'access content'

relewise.searchContent:
  path: '/relewise/search_content/{term}'
  defaults:
    _controller: '\Drupal\relewise\Controller\RelewiseController::searchContent'
  requirements:
    _access: 'TRUE'

relewise.searchTermPrediction:
  path: '/relewise/term_prediction/{term}'
  defaults:
    _controller: '\Drupal\relewise\Controller\RelewiseController::searchTermPrediction'
  requirements:
    _access: 'TRUE'

relewise.reindex:
  path: '/admin/config/search/relewise/reindex'
  defaults:
    _controller: '\Drupal\relewise\Controller\RelewiseController::reindex'
    _title: 'Reindex'
  requirements:
    _permission: 'configure relewise'

relewise.purge:
  path: '/admin/config/search/relewise/purge'
  defaults:
    _controller: '\Drupal\relewise\Controller\RelewiseController::purge'
    _title: 'Purge'
  requirements:
    _permission: 'configure relewise'

relewise.settings:
  path: '/admin/config/search/relewise'
  defaults:
    _form: '\Drupal\relewise\Form\RelewiseSettingsForm'
    _title: 'Relewise'
  requirements:
    _permission: 'configure relewise'
