relewise.trackContentView:
  path: '/relewise/entity_view/{entity_type_id}/{entity_id}'
  defaults:
    _controller: '\Drupal\relewise\Controller\TrackerController::trackEntityView'
  requirements:
    _permission: 'access content'

relewise.reindex:
  path: '/admin/config/search/relewise/reindex'
  defaults:
    _controller: '\Drupal\relewise\Controller\IndexerController::reindex'
    _title: 'Reindex'
  requirements:
    _permission: 'configure relewise'

relewise.purge:
  path: '/admin/config/search/relewise/purge'
  defaults:
    _controller: '\Drupal\relewise\Controller\IndexerController::purge'
    _title: 'Purge'
  requirements:
    _permission: 'configure relewise'

relewise.settings:
  path: '/admin/config/search/relewise'
  defaults:
    _form: '\Drupal\relewise\Form\RelewiseSettingsForm'
    _title: 'Relewise'
  requirements:
    _permission: 'configure relewise'

entity.entity_indexer.add_page:
  path: '/admin/config/search/relewise/entity_indexer/add'
  defaults:
    _controller: '\Drupal\relewise\Controller\ConfigEntityController::addContent'
    _title: 'Add entity indexer'
  requirements:
    _permission: 'configure relewise'

entity.entity_indexer.collection:
  path: '/admin/config/search/relewise/entity_indexer'
  defaults:
    _entity_list: 'entity_indexer'
    _title: 'Entity indexer'
  requirements:
    _permission: 'configure relewise'

entity.entity_indexer.add_form:
  path: '/admin/config/search/relewise/entity_indexer/add/{entity_type_id}/{bundle}'
  defaults:
    _entity_form: 'entity_indexer.add'
    _title: 'Add entity indexer'
  requirements:
    _permission: 'configure relewise'

entity.relewise_index.add_form:
  path: '/admin/config/search/relewise/relewise_index/add'
  defaults:
    _entity_form: 'relewise_index.add'
    _title: 'Add Relewise index'
  requirements:
    _permission: 'configure relewise'
