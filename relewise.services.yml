services:
  relewise:
    class: Drupal\relewise\Relewise
    arguments:
      - '@relewise.api'
      - '@entity_type.manager'
      - '@entity_type.bundle.info'
      - '@module_handler'
      - '@title_resolver'
      - '@current_route_match'
      - '@request_stack'

  relewise.api:
    class: Drupal\relewise\RelewiseAPI
    arguments: ['@http_client']
